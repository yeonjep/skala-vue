# GitHub Pages 영구 배포 → https://yeonjep.github.io/skala-vue/
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prefetch ESPN snapshots
        continue-on-error: true
        env:
          VITE_ESPN_PROXY: https://site.api.espn.com/apis
        run: npm run prefetch:espn
      - name: Build
        env:
          DEPLOY_BASE: /skala-vue/
        run: npx vite build
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
